# Light Contrast Theme for Rio Terminal
# Minimalist white background with Vivid Royal Blue cursor and grayscale colors

[colors]
bar = "#c2c8f6"
split = '#e5e5e5'
tabs = '#737373'
tabs-active = '#111111'

background = '#ffffff'
foreground = '#1a1a1a'
cursor = '#0055ff'
vi-cursor = '#1a1a1a'
selection-background = '#e0e0e0'
selection-foreground = '#1a1a1a'

# ANSI Colors
black = '#1a1a1a'
red = '#d32f2f'
green = '#22863a'
yellow = '#b27a00'
blue = '#0055ff'
magenta = '#8625ec'
cyan = '#00838f'
white = '#f5f5f5'

# Bright Colors
light-black = '#777777'
light-red = '#d32f2f'
light-green = '#22863a'
light-yellow = '#b27a00'
light-blue = '#0055ff'
light-magenta = '#8625ec'
light-cyan = '#00838f'
light-white = '#ffffff'
